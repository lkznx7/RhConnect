<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&amp;family=DM+Sans:wght@400;500;700&amp;display=swap');
      .title { font-family: 'Hanken Grotesk', sans-serif; font-weight: 800; }
      .heading { font-family: 'Hanken Grotesk', sans-serif; font-weight: 700; }
      .subheading { font-family: 'Hanken Grotesk', sans-serif; font-weight: 600; }
      .body { font-family: 'DM Sans', sans-serif; font-weight: 400; }
      .body-bold { font-family: 'DM Sans', sans-serif; font-weight: 700; }
      .mono { font-family: monospace; font-size: 13px; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#F7F9FB"/>

  <!-- Header Banner -->
  <rect x="0" y="0" width="1200" height="110" fill="#0D1728"/>
  <rect x="0" y="106" width="1200" height="4" fill="#006769"/>

  <!-- Logo Mark Simulation -->
  <g transform="translate(60, 26)">
    <circle cx="28" cy="28" r="28" fill="#006769"/>
    <text x="28" y="36" fill="#FFFFFF" font-family="'Hanken Grotesk', sans-serif" font-weight="800" font-size="22" text-anchor="middle">RH</text>
  </g>
  <text x="132" y="55" fill="#FFFFFF" class="heading" font-size="26" letter-spacing="-0.5">RH Connect — Guia de Estilo &amp; Identidade Visual</text>
  <text x="132" y="80" fill="#8A9EB5" class="body" font-size="14">Paleta Cromática Oficial • Tipografia Institucional • Especificações de Design</text>

  <!-- Tag Version -->
  <rect x="1030" y="38" width="110" height="32" rx="16" fill="#1C2A44"/>
  <text x="1085" y="59" fill="#89F3F6" class="body-bold" font-size="12" text-anchor="middle">SISTEMA v2.4</text>

  <!-- COLUNA 1: CORES (Esquerda - 700px) -->
  <text x="60" y="160" fill="#0D1728" class="heading" font-size="20">1. PALETA DE CORES INSTITUCIONAL</text>
  <text x="60" y="180" fill="#6C829E" class="body" font-size="13">Cores primárias, complementares, neutras e de suporte da interface</text>

  <!-- Grade de Cores -->
  <!-- Cor 1: Primary Teal -->
  <g transform="translate(60, 205)" filter="url(#shadow)">
    <rect width="165" height="120" rx="12" fill="#FFFFFF"/>
    <rect width="165" height="65" rx="12" fill="#006769"/>
    <rect y="50" width="165" height="15" fill="#006769"/>
    <text x="14" y="88" fill="#0D1728" class="subheading" font-size="14">Teal Primário</text>
    <text x="14" y="105" fill="#6C829E" class="mono">#006769</text>
    <circle cx="145" cy="94" r="5" fill="#006769"/>
  </g>

  <!-- Cor 2: Primary Container -->
  <g transform="translate(240, 205)" filter="url(#shadow)">
    <rect width="165" height="120" rx="12" fill="#FFFFFF"/>
    <rect width="165" height="65" rx="12" fill="#008285"/>
    <rect y="50" width="165" height="15" fill="#008285"/>
    <text x="14" y="88" fill="#0D1728" class="subheading" font-size="14">Teal Vibrante</text>
    <text x="14" y="105" fill="#6C829E" class="mono">#008285</text>
    <circle cx="145" cy="94" r="5" fill="#008285"/>
  </g>

  <!-- Cor 3: Navy Profundo -->
  <g transform="translate(420, 205)" filter="url(#shadow)">
    <rect width="165" height="120" rx="12" fill="#FFFFFF"/>
    <rect width="165" height="65" rx="12" fill="#0D1728"/>
    <rect y="50" width="165" height="15" fill="#0D1728"/>
    <text x="14" y="88" fill="#0D1728" class="subheading" font-size="14">Deep Navy</text>
    <text x="14" y="105" fill="#6C829E" class="mono">#0D1728</text>
    <circle cx="145" cy="94" r="5" fill="#0D1728"/>
  </g>

  <!-- Cor 4: Navy Sidebar Active -->
  <g transform="translate(600, 205)" filter="url(#shadow)">
    <rect width="165" height="120" rx="12" fill="#FFFFFF"/>
    <rect width="165" height="65" rx="12" fill="#1C2C47"/>
    <rect y="50" width="165" height="15" fill="#1C2C47"/>
    <text x="14" y="88" fill="#0D1728" class="subheading" font-size="14">Navy Médio</text>
    <text x="14" y="105" fill="#6C829E" class="mono">#1C2C47</text>
    <circle cx="145" cy="94" r="5" fill="#1C2C47"/>
  </g>

  <!-- LINHA 2 DE CORES -->
  <!-- Cor 5: Cyan Light / Fixed -->
  <g transform="translate(60, 345)" filter="url(#shadow)">
    <rect width="165" height="120" rx="12" fill="#FFFFFF"/>
    <rect width="165" height="65" rx="12" fill="#89F3F6"/>
    <rect y="50" width="165" height="15" fill="#89F3F6"/>
    <text x="14" y="88" fill="#0D1728" class="subheading" font-size="14">Cyan Destaque</text>
    <text x="14" y="105" fill="#6C829E" class="mono">#89F3F6</text>
    <circle cx="145" cy="94" r="5" fill="#89F3F6"/>
  </g>

  <!-- Cor 6: Azul Secundário -->
  <g transform="translate(240, 345)" filter="url(#shadow)">
    <rect width="165" height="120" rx="12" fill="#FFFFFF"/>
    <rect width="165" height="65" rx="12" fill="#2356D8"/>
    <rect y="50" width="165" height="15" fill="#2356D8"/>
    <text x="14" y="88" fill="#0D1728" class="subheading" font-size="14">Azul Ações</text>
    <text x="14" y="105" fill="#6C829E" class="mono">#2356D8</text>
    <circle cx="145" cy="94" r="5" fill="#2356D8"/>
  </g>

  <!-- Cor 7: Fundo Slate Light -->
  <g transform="translate(420, 345)" filter="url(#shadow)">
    <rect width="165" height="120" rx="12" fill="#FFFFFF"/>
    <rect width="165" height="65" rx="12" fill="#ECEEF0"/>
    <rect y="50" width="165" height="15" fill="#ECEEF0"/>
    <text x="14" y="88" fill="#0D1728" class="subheading" font-size="14">Superfície / Cards</text>
    <text x="14" y="105" fill="#6C829E" class="mono">#ECEEF0</text>
    <circle cx="145" cy="94" r="5" fill="#ECEEF0"/>
  </g>

  <!-- Cor 8: Background Claro -->
  <g transform="translate(600, 345)" filter="url(#shadow)">
    <rect width="165" height="120" rx="12" fill="#FFFFFF"/>
    <rect width="165" height="65" rx="12" fill="#F7F9FB" stroke="#E0E3E5"/>
    <rect y="50" width="165" height="15" fill="#F7F9FB"/>
    <text x="14" y="88" fill="#0D1728" class="subheading" font-size="14">Fundo da Página</text>
    <text x="14" y="105" fill="#6C829E" class="mono">#F7F9FB</text>
    <circle cx="145" cy="94" r="5" fill="#F7F9FB" stroke="#BCC9C9"/>
  </g>

  <!-- STATUS & FEEDBACK BADGES BAR -->
  <text x="60" y="505" fill="#0D1728" class="heading" font-size="16">CORES DE STATUS E FEEDBACK DO SISTEMA</text>
  <g transform="translate(60, 520)">
    <!-- Sucesso / Aprovado -->
    <rect x="0" y="0" width="165" height="38" rx="8" fill="#E6FFFA" stroke="#99F6E4"/>
    <circle cx="18" cy="19" r="4" fill="#059669"/>
    <text x="32" y="24" fill="#065F46" class="body-bold" font-size="12">Aprovado / Ativo</text>

    <!-- Em Andamento / Alerta -->
    <rect x="180" y="0" width="165" height="38" rx="8" fill="#FFFBEB" stroke="#FDE68A"/>
    <circle cx="198" cy="19" r="4" fill="#D97706"/>
    <text x="212" y="24" fill="#92400E" class="body-bold" font-size="12">Em Análise / Alerta</text>

    <!-- Informativo -->
    <rect x="360" y="0" width="165" height="38" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
    <circle cx="378" cy="19" r="4" fill="#2563EB"/>
    <text x="392" y="24" fill="#1E40AF" class="body-bold" font-size="12">Informativo / Edital</text>

    <!-- Reprovado / Erro -->
    <rect x="540" y="0" width="165" height="38" rx="8" fill="#FEF2F2" stroke="#FECACA"/>
    <circle cx="558" cy="19" r="4" fill="#DC2626"/>
    <text x="572" y="24" fill="#991B1B" class="body-bold" font-size="12">Reprovado / Crítico</text>
  </g>

  <!-- BORDER RADIUS & CORNER RULES -->
  <g transform="translate(60, 585)" filter="url(#shadow)">
    <rect width="705" height="155" rx="14" fill="#FFFFFF"/>
    <text x="24" y="32" fill="#0D1728" class="heading" font-size="15">ARREDONDAMENTO DE BORDAS (BORDER RADIUS)</text>
    <text x="24" y="52" fill="#6C829E" class="body" font-size="13">Padronização moderna e amigável aplicada em todas as 36 telas</text>

    <!-- Exemplo 1 -->
    <rect x="24" y="70" width="195" height="60" rx="8" fill="#F2F4F6" stroke="#E0E3E5"/>
    <text x="38" y="96" fill="#0D1728" class="body-bold" font-size="13">rounded-lg (8px)</text>
    <text x="38" y="114" fill="#6C829E" class="body" font-size="11">Botões, inputs e badges</text>

    <!-- Exemplo 2 -->
    <rect x="235" y="70" width="220" height="60" rx="16" fill="#F2F4F6" stroke="#006769" stroke-width="1.5"/>
    <text x="249" y="96" fill="#006769" class="body-bold" font-size="13">rounded-xl (16px) • Padrão</text>
    <text x="249" y="114" fill="#6C829E" class="body" font-size="11">Cards de métricas e tabelas</text>

    <!-- Exemplo 3 -->
    <rect x="470" y="70" width="210" height="60" rx="24" fill="#F2F4F6" stroke="#E0E3E5"/>
    <text x="484" y="96" fill="#0D1728" class="body-bold" font-size="13">rounded-2xl / 3xl</text>
    <text x="484" y="114" fill="#6C829E" class="body" font-size="11">Modais e containers nobres</text>
  </g>

  <!-- DIVISOR VERTICAL -->
  <line x1="800" y1="140" x2="800" y2="750" stroke="#E0E3E5" stroke-width="1.5"/>

  <!-- COLUNA 2: TIPOGRAFIA (Direita - 340px) -->
  <text x="830" y="160" fill="#0D1728" class="heading" font-size="20">2. TIPOGRAFIA OFICIAL</text>
  <text x="830" y="180" fill="#6C829E" class="body" font-size="13">Famílias tipográficas de títulos e textos</text>

  <!-- Cartão Fonte 1: Hanken Grotesk -->
  <g transform="translate(830, 205)" filter="url(#shadow)">
    <rect width="310" height="235" rx="14" fill="#FFFFFF"/>
    
    <rect x="20" y="20" width="40" height="40" rx="8" fill="#006769"/>
    <text x="40" y="46" fill="#FFFFFF" class="heading" font-size="20" text-anchor="middle">Aa</text>

    <text x="72" y="38" fill="#0D1728" class="heading" font-size="18">Hanken Grotesk</text>
    <text x="72" y="55" fill="#006769" class="body-bold" font-size="12">TÍTULOS, HEADLINES &amp; NÚMEROS</text>

    <line x1="20" y1="75" x2="290" y2="75" stroke="#F2F4F6" stroke-width="1.5"/>

    <text x="20" y="105" fill="#0D1728" class="title" font-size="28">Display 48px Bold</text>
    <text x="20" y="138" fill="#0D1728" class="heading" font-size="20">Headline 24px SemiBold</text>
    <text x="20" y="165" fill="#4B5F7F" class="subheading" font-size="16">Title 18px Medium</text>
    
    <rect x="20" y="185" width="270" height="35" rx="6" fill="#F7F9FB"/>
    <text x="32" y="207" fill="#6C829E" class="body" font-size="11">Utilizado em cabeçalhos, KPIs e logos</text>
  </g>

  <!-- Cartão Fonte 2: DM Sans -->
  <g transform="translate(830, 460)" filter="url(#shadow)">
    <rect width="310" height="280" rx="14" fill="#FFFFFF"/>
    
    <rect x="20" y="20" width="40" height="40" rx="8" fill="#0D1728"/>
    <text x="40" y="46" fill="#FFFFFF" class="body-bold" font-size="20" text-anchor="middle">Bb</text>

    <text x="72" y="38" fill="#0D1728" class="heading" font-size="18">DM Sans</text>
    <text x="72" y="55" fill="#2356D8" class="body-bold" font-size="12">CORPO, TABELAS &amp; INTERFACE</text>

    <line x1="20" y1="75" x2="290" y2="75" stroke="#F2F4F6" stroke-width="1.5"/>

    <text x="20" y="102" fill="#0D1728" class="body-bold" font-size="14">Body Regular &amp; Medium (14px)</text>
    <text x="20" y="122" fill="#4B5F7F" class="body" font-size="13">"Conectamos pessoas e transformamos resultados através da gestão humana."</text>
    
    <text x="20" y="160" fill="#0D1728" class="body-bold" font-size="13">Label &amp; Metadados (11px / 12px)</text>
    <text x="20" y="180" fill="#6C829E" class="mono">UPPERCASE • TRACKING WIDE • 0.04em</text>

    <!-- Ícones -->
    <rect x="20" y="205" width="270" height="55" rx="8" fill="#F7F9FB" stroke="#E0E3E5"/>
    <text x="32" y="226" fill="#006769" class="body-bold" font-size="12">Google Material Symbols Outlined</text>
    <text x="32" y="246" fill="#6C829E" class="body" font-size="11">Ícones lineares com stroke 1.5px e ótica 20-24px</text>
  </g>

</svg>
